name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android-web:
    name: JVM, Android, JS & Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Parity tests (JVM, Android host, JS on Node, Wasm on Node)
        run: >
          ./gradlew --stacktrace
          :blobface-core:jvmTest
          :blobface-core:testAndroidHostTest
          :blobface-core:jsNodeTest
          :blobface-core:wasmJsNodeTest
      - name: Compile blobface-compose and the sample
        run: >
          ./gradlew --stacktrace
          :blobface-compose:compileKotlinJvm
          :blobface-compose:compileAndroidMain
          :blobface-compose:compileKotlinJs
          :blobface-compose:compileKotlinWasmJs
          :sample:compileKotlinJvm
          :sample-android:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/'

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Parity tests (iOS simulator)
        run: ./gradlew --stacktrace :blobface-core:iosSimulatorArm64Test
      - name: Compile iOS targets
        run: >
          ./gradlew --stacktrace
          :blobface-core:compileKotlinIosX64
          :blobface-core:compileKotlinIosArm64
          :blobface-compose:compileKotlinIosArm64
          :blobface-compose:compileKotlinIosSimulatorArm64
          :sample:linkDebugFrameworkIosSimulatorArm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-ios
          path: '**/build/reports/tests/'
