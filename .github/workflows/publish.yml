name: Publish

# Runs when a GitHub release is published. Uploads and releases
# io.github.pradyumna-dp:blobface-core and :blobface-compose to Maven Central.
# Credentials live only in the "maven-central" environment, which requires the
# owner's approval before this job can start; nothing is stored in the repo.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: macos-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify parity before publishing
        run: ./gradlew --stacktrace :blobface-core:jvmTest :blobface-core:iosSimulatorArm64Test
      - name: Publish to Maven Central
        run: ./gradlew --stacktrace --no-configuration-cache publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
