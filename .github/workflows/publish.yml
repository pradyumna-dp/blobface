name: Publish

# Runs when a GitHub release is published. Uploads and releases
# io.github.pradyumna-dp:blobface-core and :blobface-compose to Maven Central.
# Credentials come only from repository secrets; nothing is stored in the repo.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify parity before publishing
        run: ./gradlew --stacktrace :blobface-core:jvmTest :blobface-core:iosSimulatorArm64Test
      - name: Publish to Maven Central
        run: ./gradlew --stacktrace --no-configuration-cache publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
